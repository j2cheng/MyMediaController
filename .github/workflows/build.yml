name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgstreamer1.0-dev

      - name: Build (${{ matrix.build_type }})
        working-directory: NewCsio
        run: |
          chmod +x build.sh
          ./build.sh -t ${{ matrix.build_type }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newcsio-${{ matrix.build_type }}
          path: |
            NewCsio/build/newcsio_demo
            NewCsio/build/libnewcsio_core.a
          if-no-files-found: ignore
